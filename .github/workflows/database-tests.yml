name: Database Tests

on:
  pull_request:
    branches: ['master']
    paths:
      - 'supabase/**'
      - 'reference-data/**'
      - 'scripts/load-reference-data.mjs'
      - 'package.json'
      - '.sqlfluff'
      - '.sqlfluffignore'
      - '.github/workflows/database-tests.yml'
  push:
    branches: ['master']
    paths:
      - 'supabase/**'
      - 'reference-data/**'
      - 'scripts/load-reference-data.mjs'
      - 'package.json'
      - '.sqlfluff'
      - '.sqlfluffignore'
      - '.github/workflows/database-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: issue-48-lint

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate reference taxonomy
        run: npm run reference-data:check

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install SQLFluff
        run: pip install sqlfluff==4.3.0

      - name: Format legacy schema migration
        run: sqlfluff fix supabase/migrations/20251105230638_remote_schema.sql --force

      - name: Commit formatted legacy schema migration
        run: |
          if git diff --quiet -- supabase/migrations/20251105230638_remote_schema.sql; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20251105230638_remote_schema.sql
          git commit -m "Format legacy schema migration with SQLFluff"
          git push origin HEAD:issue-48-lint

      - name: Lint SQL
        run: npm run lint:sql

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Start local Supabase
        run: supabase start

      - name: Verify reference-data loader
        run: npm run reference-data:local

      - name: Run database tests
        run: supabase test db

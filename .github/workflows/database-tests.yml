name: Database Tests

on:
  pull_request:
    branches: ['master']
    paths:
      - 'supabase/**'
      - 'reference-data/**'
      - 'fixture-data/**'
      - 'scripts/load-reference-data.mjs'
      - 'scripts/load-fixture-data.mjs'
      - 'package.json'
      - '.sqlfluff'
      - '.github/workflows/database-tests.yml'
  push:
    branches: ['master']
    paths:
      - 'supabase/**'
      - 'reference-data/**'
      - 'scripts/load-reference-data.mjs'
      - 'package.json'
      - '.sqlfluff'
      - '.github/workflows/database-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate reference taxonomy
        run: npm run reference-data:check

      - name: Validate fixture data
        run: npm run fixture-data:check

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install SQLFluff
        run: pip install sqlfluff==4.3.0

      - name: Lint SQL
        run: npm run lint:sql

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Start local Supabase
        run: supabase start

      - name: Verify reference-data loader
        run: npm run reference-data:local

      - name: Run database tests
        run: supabase test db

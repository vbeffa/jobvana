name: Database Tests

on:
  pull_request:
    branches: ['master']
    paths:
      - 'supabase/**'
      - 'reference-data/**'
      - 'fixture-data/**'
      - 'scripts/load-reference-data.mjs'
      - 'scripts/load-fixture-data.mjs'
      - '.sqlfluff'
      - '.github/workflows/database-tests.yml'
  push:
    branches: ['master']
    paths:
      - 'supabase/**'
      - 'reference-data/**'
      - 'scripts/load-reference-data.mjs'
      - '.sqlfluff'
      - '.github/workflows/database-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate reference taxonomy
        run: node scripts/load-reference-data.mjs --check

      - name: Validate fixture data
        run: npm run fixture-data:check

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install SQLFluff
        run: pip install sqlfluff==4.3.0

      - name: Lint SQL
        run: sqlfluff lint supabase/migrations supabase/seeds

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.118.0

      - name: Start local Supabase
        run: supabase start

      - name: Verify fixture login
        shell: bash
        run: |
          status="$(supabase status -o env)"
          api_url="$(printf '%s\n' "$status" | sed -n 's/^API_URL="\([^"]*\)"$/\1/p')"
          anon_key="$(printf '%s\n' "$status" | sed -n 's/^ANON_KEY="\([^"]*\)"$/\1/p')"

          test -n "$api_url"
          test -n "$anon_key"

          response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "$api_url/auth/v1/token?grant_type=password" \
              --header "apikey: $anon_key" \
              --header 'Content-Type: application/json' \
              --data '{"email":"johndoe@test.com","password":"abcd1234"}'
          )"

          printf '%s' "$response" | node -e '
            const fs = require("node:fs");
            const response = JSON.parse(fs.readFileSync(0, "utf8"));
            if (
              !response.access_token ||
              response.user?.email !== "johndoe@test.com"
            ) {
              throw new Error(
                "Fixture login did not return the expected authenticated user."
              );
            }
          '

      - name: Verify reference-data loader
        run: node scripts/load-reference-data.mjs --local

      - name: Run database tests
        run: supabase test db

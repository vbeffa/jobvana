name: Database Tests

on:
  pull_request:
    branches: ['master']
    paths:
      - 'supabase/**'
      - 'reference-data/**'
      - 'fixture-data/**'
      - 'scripts/load-reference-data.mjs'
      - 'scripts/load-fixture-data.mjs'
      - 'scripts/test-fixture-login.mjs'
      - '.sqlfluff'
      - '.sqlfluffignore'
      - '.nvmrc'
      - '.github/workflows/database-tests.yml'
  push:
    branches: ['master']
    paths:
      - 'supabase/**'
      - 'reference-data/**'
      - 'fixture-data/**'
      - 'scripts/load-reference-data.mjs'
      - 'scripts/load-fixture-data.mjs'
      - 'scripts/test-fixture-login.mjs'
      - '.sqlfluff'
      - '.sqlfluffignore'
      - '.nvmrc'
      - '.github/workflows/database-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Validate reference taxonomy
        run: node scripts/load-reference-data.mjs --check

      - name: Validate bulk fixture data
        run: npm run fixture-data:check

      - name: Validate demo fixture data
        run: npm run demo-data:check

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install SQLFluff
        run: pip install sqlfluff==4.3.0

      - name: Lint SQL
        run: sqlfluff lint supabase/migrations supabase/seeds

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Start local Supabase
        run: supabase start

      - name: Verify production-safe reference seed
        run: |
          supabase db query --local 'do $jobvana$ begin if exists (select 1 from auth.users) or exists (select 1 from public.companies) or exists (select 1 from public.jobs) or exists (select 1 from public.job_seekers) then raise exception using message = $msg$default seed loaded synthetic marketplace data$msg$; end if; end $jobvana$;'

      - name: Load demo fixture
        run: |
          docker exec -i supabase_db_jobvana psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/seeds/10_demo_data.sql
          docker exec -i supabase_db_jobvana psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/seeds/99_reset_taxonomy_sequences.sql

      - name: Verify fixture login
        run: node scripts/test-fixture-login.mjs

      - name: Verify reference-data loader
        run: node scripts/load-reference-data.mjs --local

      - name: Run database tests
        run: supabase test db
